<meta charset="UTF-8"/>

<title>Auto Refresh</title>
<style>
:root{
  --bg:#18181b;--card:#1e1e22;--card-alt:#19191d;--border:#2e2e34;
  --accent:#ea580c;--green:#22c55e;--text:#fff;--muted:#a1a1aa
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);padding:28px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center
}
.container{
  width:100%;max-width:740px;display:flex;
  flex-direction:column;align-items:center
}
.header{
  display:flex;flex-direction:column;align-items:center;
  gap:10px;margin-bottom:18px
}
.logo-wrap{
  position:relative;width:56px;height:56px;background:var(--accent);
  border-radius:16px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(234,88,12,.35)
}
.logo-wrap.help-logo{
  border:2px dashed #ffffff;
  box-shadow:0 8px 20px rgba(234,88,12,.22)
}
.badge-icon{
  position:absolute;bottom:-4px;right:-4px;width:22px;height:22px;
  background:var(--green);border:2.5px solid var(--bg);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#052e16;font-weight:900;font-size:12px
}
h1{font-size:23px;font-weight:800;letter-spacing:-.5px}
.step-section{
  width:100%;background:var(--card);border:1.5px solid rgba(234,88,12,.45);
  border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;
  gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.22)
}
.step-section.secondary{
  background:var(--card-alt);border:1.5px dashed #3f3f46;
  box-shadow:none;opacity:.95
}
.step-head{display:flex;align-items:center;gap:10px}
.head-pill{
  position:relative;height:32px;min-width:32px;padding:0 9px;
  border-radius:9px;background:#27272a;border:1px solid #3f3f46;
  color:#e4e4e7;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px
}
.head-pill.brand{background:var(--accent);border-color:var(--accent);padding:0;width:32px}
.head-pill.help{background:rgba(234,88,12,.16);border-color:rgba(234,88,12,.5);color:#fb923c}
.head-pill.pinned{border-color:rgba(34,197,94,.5);color:var(--green)}
.mini-check{
  position:absolute;bottom:-4px;right:-4px;width:13px;height:13px;
  border-radius:50%;background:var(--green);color:#052e16;font-size:8px;
  font-weight:900;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--card-alt)
}
.head-colon{color:#a1a1aa;font-weight:900;font-size:18px;margin-left:-8px;margin-right:2px}
.head-arrow{color:var(--accent);font-weight:900;font-size:16px}
.svg-frame{
  width:100%;border-radius:12px;overflow:hidden;
  border:1px solid #323238;background:#121215
}
.svg-frame svg{width:100%;height:auto;display:block}
.shortcut-bar{
  width:100%;margin-top:14px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:10px 18px;display:flex;align-items:center;
  justify-content:center;gap:10px
}
.kbd{
  height:30px;min-width:34px;padding:0 10px;border-radius:7px;
  background:#27272a;border:1px solid #3f3f46;border-bottom-width:3px;
  color:#f4f4f5;font-weight:700;font-size:13px;display:flex;align-items:center
}
.plus{color:var(--muted);font-weight:700;font-size:14px}
.section-break{
  margin-top:64px;margin-bottom:18px;display:flex;flex-direction:column;
  align-items:center;gap:24px
}
.break-line{width:180px;height:2px;background:#2e2e34;border-radius:2px}
footer{
  margin-top:28px;padding:14px 16px;text-align:center;font-size:12px;
  color:#71717a;border-top:1px solid #27272a;width:100%;max-width:740px
}
footer a{color:inherit;text-decoration:underline}
</style>
