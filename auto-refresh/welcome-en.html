<style>
:root{--bg:#18181b;--card:#1e1e22;--border:#2e2e34;--accent:#ea580c;--green:#22c55e;--text:#fff;--muted:#a1a1aa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;padding:40px 20px;display:flex;flex-direction:column;align-items:center}
.container{width:100%;max-width:780px;display:flex;flex-direction:column;gap:28px}
.header{display:flex;flex-direction:column;align-items:center;gap:14px}
.logo-wrap{position:relative;width:68px;height:68px;background:var(--accent);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(234,88,12,.35)}
.check-badge{position:absolute;bottom:-5px;right:-5px;width:24px;height:24px;background:var(--green);border:3px solid var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#052e16;font-weight:900;font-size:13px}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
.step-section{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px}
.step-head{display:flex;align-items:center;gap:12px}
.head-pill{height:36px;min-width:36px;padding:0 10px;border-radius:10px;background:#27272a;border:1px solid #3f3f46;color:#e4e4e7;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.head-pill.brand{background:var(--accent);border-color:var(--accent);padding:0;width:36px}
.head-arrow{color:var(--accent);font-weight:900;font-size:18px}
.svg-frame{width:100%;border-radius:14px;overflow:hidden;border:1px solid #323238;background:#121215}
.svg-frame svg{width:100%;height:auto;display:block}
.footer{text-align:center;padding-top:4px}
.footer a{color:var(--muted);text-decoration:none;font-size:13px;border-bottom:1px solid #3f3f46;padding-bottom:2px}
.footer a:hover{color:var(--text)}
</style>
</head>
